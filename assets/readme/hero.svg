<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">IntentBridge：无损传达 Skill</title>
  <desc id="hero-desc">帮助 AI 用户把模糊想法变成可判断的小样，再根据反馈修正并交接共识。图中流程为说出想法、看见小样、修正共识。</desc>
  <rect width="1200" height="520" rx="30" fill="#F5F3EC"/>
  <path d="M64 236H1136" stroke="#DEDCD2" stroke-width="1.5"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="62" fill="#61746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2.5">INTENTBRIDGE</text>
    <rect x="930" y="34" width="206" height="42" rx="21" fill="#E9EEE7"/>
    <text x="1033" y="61" text-anchor="middle" fill="#38675F" font-size="18" font-weight="600" letter-spacing="0.5">AI 协作 · SKILL 1.0.0</text>
    <text x="64" y="151" fill="#18332F" font-size="78" font-weight="720" letter-spacing="-2">无损传达<tspan dx="14" fill="#1B766C" font-size="48" font-weight="650" letter-spacing="0">Skill</tspan></text>
    <text x="68" y="207" fill="#3F5C55" font-size="40" font-weight="520">先看 AI 怎么理解，再把重要要求说清。</text>
  </g>

  <g id="workflow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="64" y="270" width="330" height="150" rx="22" fill="#FFFEFA" stroke="#D9D8CE" stroke-width="1.5"/>
    <text x="92" y="307" fill="#1B766C" font-size="22" font-weight="650">你提供</text>
    <text x="92" y="356" fill="#18332F" font-size="40" font-weight="680">说出想法</text>
    <text x="92" y="396" fill="#687B73" font-size="24">“简单一点”</text>
    <path d="M351 288L366 303L351 318" fill="none" stroke="#D68D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M402 345H426" stroke="#9EAAA2" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M420 338L430 345L420 352" fill="none" stroke="#9EAAA2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="435" y="270" width="330" height="150" rx="22" fill="#FFFEFA" stroke="#D9D8CE" stroke-width="1.5"/>
    <text x="463" y="307" fill="#C27143" font-size="22" font-weight="650">AI 展示</text>
    <text x="463" y="356" fill="#18332F" font-size="40" font-weight="680">看见小样</text>
    <text x="463" y="396" fill="#687B73" font-size="24">标出暂时的假设</text>
    <rect x="709" y="291" width="28" height="3" rx="1.5" fill="#E5A85F"/>
    <rect x="709" y="301" width="20" height="3" rx="1.5" fill="#D8D8CE"/>
    <rect x="709" y="311" width="25" height="3" rx="1.5" fill="#D8D8CE"/>

    <path d="M773 345H797" stroke="#9EAAA2" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M791 338L801 345L791 352" fill="none" stroke="#9EAAA2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="806" y="270" width="330" height="150" rx="22" fill="#FFFEFA" stroke="#D9D8CE" stroke-width="1.5"/>
    <text x="834" y="307" fill="#1B766C" font-size="22" font-weight="650">反馈后</text>
    <text x="834" y="356" fill="#18332F" font-size="40" font-weight="680">修正共识</text>
    <text x="834" y="396" fill="#687B73" font-size="24">保留 · 修正 · 未定</text>
    <circle cx="1090" cy="300" r="7" fill="#1B766C"/>
    <circle cx="1112" cy="300" r="7" fill="#E5A85F"/>
  </g>

  <g id="feedback-loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <path d="M971 426V451H600V429" fill="none" stroke="#D68D4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M593 437L600 427L607 437" fill="none" stroke="#D68D4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="701" y="437" width="195" height="30" rx="15" fill="#F5F3EC"/>
    <text x="798" y="459" text-anchor="middle" fill="#A9683B" font-size="22" font-weight="600">按反馈修正关键差异</text>
    <text x="1136" y="493" text-anchor="end" fill="#7A8880" font-size="18">AI 参与绘制 · 流程示意 · 非运行截图</text>
  </g>
</svg>